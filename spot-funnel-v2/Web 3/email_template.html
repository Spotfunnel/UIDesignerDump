<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        /* Light Mode Aesthetic - Clean & Professional */
        body {
            background-color: #f9fafb;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .logo {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Accent dot for logo */
        .logo-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-left: 2px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 16px;
            color: #111827;
            letter-spacing: -0.25px;
        }

        p {
            font-size: 16px;
            line-height: 26px;
            color: #4b5563;
            margin: 0 0 32px;
        }

        .btn {
            display: inline-block;
            background-color: #111827;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 8px;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #000000;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
        }

        .link {
            color: #6b7280;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo">SpotFunnel<span class="logo-dot"></span></div>

            <!-- Change Content for different templates -->
            <h1>You've been invited</h1>
            <p>You have been invited to join the SpotFunnel workspace. Click the button below to accept your invitation
                and set up your account.</p>

            <a href="{{ .ConfirmationURL }}" class="btn">Join Workspace</a>
        </div>

        <div class="footer">
            <p style="margin: 0;">© 2024 SpotFunnel AI. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
