<!DOCTYPE html>
<html>

<head>
    <style>
        @font-face {
            font-family: 'Roobert';
            src: url('public/fonts/Roobert-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 1024px;
            width: 1024px;
            font-family: 'Roobert', sans-serif;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 60px;
            width: 100%;
            height: 100%;
        }

        svg {
            width: 512px;
            height: 512px;
        }

        .text {
            font-size: 100px;
            font-weight: bold;
            letter-spacing: -0.02em;
            color: black;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <svg viewBox="0 0 100 100" fill="black" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="24" r="17" />
            <path d="M 12 42 L 27 42 L 48 92 L 33 92 Z" />
            <path d="M 88 42 L 73 42 L 52 92 L 67 92 Z" />
        </svg>
        <div class="text">SPOTFUNNEL</div>
    </div>
</body>

</html>
