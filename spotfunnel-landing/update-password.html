<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | SpotFunnel</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Roobert';
            src: url('fonts/RoobertTRIALVF-BF67243fd545701.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        :root {
            --bg-base: #05070a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-blue: #00D1FF;
            --beam-glow: rgba(0, 209, 255, 0.15);
            --grid-color: rgba(0, 209, 255, 0.05);
            --border-color: rgba(0, 209, 255, 0.1);
            --font-sans: 'Roobert', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            --ease-custom: cubic-bezier(0.16, 1, 0.3, 1);
            --status-good: #4CAF50;
            --status-critical: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Immersive Background */
        .immersive-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #0c1a2e 0%, #05070a 60%);
        }

        .immersive-bg::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 1200px;
            height: 140%;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 209, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 209, 255, 0.03) 0%, transparent 60%);
            filter: blur(100px);
            opacity: 1;
            pointer-events: none;
        }

        /* Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            transition: all 0.3s var(--ease-custom);
            font-family: var(--font-sans);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px var(--beam-glow);
        }

        /* Show Password Toggle */
        .password-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .password-toggle input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--accent-blue);
        }

        button {
            width: 100%;
            height: 48px;
            background: var(--accent-blue);
            color: var(--bg-base);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease-custom);
            font-family: var(--font-sans);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 209, 255, 0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            display: none;
            /* Hidden by default */
        }

        #sessionInfo {
            font-weight: 600;
            color: var(--accent-blue);
        }

        #pwMsg {
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }

            80%,
            100% {
                content: '';
            }
        }
    </style>
</head>

<body>
    <div class="immersive-bg"></div>
    <div class="grid-overlay"></div>

    <div class="content">
        <div class="logo">SpotFunnel</div>

        <div class="card">
            <h1>Setup Account</h1>

            <div id="statusBox" class="status-box">
                Logged in as: <span id="sessionInfo">Checking...</span>
            </div>

            <p class="description">Set a secure password to complete your account setup.</p>

            <form id="updateForm">
                <!-- New Password -->
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                        autocomplete="new-password">
                </div>

                <!-- Show Password Toggle -->
                <div class="form-group">
                    <label class="password-toggle">
                        <input type="checkbox" id="showPassword">
                        Show Passwords
                    </label>
                </div>

                <div id="pwMsg"></div>

                <button type="submit">Save & Continue</button>
            </form>
        </div>
    </div>

    <!-- Supabase & Auth Service -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth-service.js"></script>

    <script>
        const updateForm = document.getElementById('updateForm');
        const submitBtn = updateForm.querySelector('button[type="submit"]');
        const msgDiv = document.getElementById('pwMsg');
        const statusBox = document.getElementById('statusBox');
        const sessionInfo = document.getElementById('sessionInfo');

        const passInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const showPassToggle = document.getElementById('showPassword');

        // 1. Show/Hide Password Toggle
        showPassToggle.addEventListener('change', function () {
            const type = this.checked ? 'text' : 'password';
            passInput.type = type;
            confirmInput.type = type;
        });

        // 2. Initial Session Check (Fixes "Is it broken or just confused?" anxiety)
        window.addEventListener('load', async () => {
            console.log('Page Loaded. Checking Session...');
            if (!supabase) {
                console.error('Supabase not initialized!');
                msgDiv.innerHTML = '<span style="color:var(--status-critical)">CRITICAL: Database connection failed.</span>';
                return;
            }

            const { data } = await supabase.auth.getSession();

            if (data.session && data.session.user) {
                statusBox.style.display = 'block';
                sessionInfo.textContent = data.session.user.email;
                console.log('Session confirmed:', data.session.user.email);
            } else {
                console.warn('No active session found on load.');
                // We don't redirect immediately in case the URL hash is still processing
                setTimeout(async () => {
                    const { data: retryData } = await supabase.auth.getSession();
                    if (retryData.session) {
                        statusBox.style.display = 'block';
                        sessionInfo.textContent = retryData.session.user.email;
                    } else {
                        statusBox.style.display = 'block';
                        sessionInfo.textContent = 'Not Logged In';
                        sessionInfo.style.color = 'var(--status-critical)';
                        msgDiv.innerHTML = '<span style="color:var(--status-critical)">Link expired or invalid. Please request a new invite.</span>';
                        submitBtn.disabled = true;
                    }
                }, 2000); // 2 second grace period for hash processing
            }
        });

        // 3. Form Submission
        updateForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            msgDiv.textContent = '';

            const newPw = passInput.value;
            const confirmPw = confirmInput.value;

            // Client-side Validation
            if (newPw.length < 6) {
                msgDiv.style.color = 'var(--status-critical)';
                msgDiv.textContent = 'Password must be at least 6 characters.';
                return;
            }

            if (newPw !== confirmPw) {
                msgDiv.style.color = 'var(--status-critical)';
                msgDiv.textContent = 'Passwords do not match.';
                return;
            }

            // UI Loading
            submitBtn.innerHTML = 'Saving<span class="loading-dots"></span>';
            submitBtn.style.opacity = '0.7';
            submitBtn.disabled = true;

            try {
                // Debugging: Check if supabase/auth exists
                console.log('DEBUG: Supabase Object:', supabase);
                if (supabase && !supabase.auth) {
                    console.error('DEBUG: supabase.auth is undefined! Is "supabase" the client or the library?');
                    console.log('DEBUG: window.supabase:', window.supabase);
                }

                // Call auth-service helper (safer)
                console.log('Calling updatePassword helper...');
                const { data, error } = await updatePassword(newPw);

                if (error) {
                    throw error;
                }

                // Success
                console.log('Update success:', data);
                msgDiv.style.color = 'var(--status-good)';
                msgDiv.innerHTML = '✅ Password saved! Redirecting...';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('Update failed:', err);
                msgDiv.style.color = 'var(--status-critical)';
                msgDiv.textContent = 'Error: ' + (err.message || 'Unknown error occurred.');
                submitBtn.textContent = 'Save & Continue';
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
