<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SpotFunnel</title>

    <!-- Fonts: Roobert + Inter + Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Roobert';
            src: url('fonts/RoobertTRIALVF-BF67243fd545701.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        :root {
            --bg-base: #05070a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-blue: #00D1FF;
            --beam-glow: rgba(0, 209, 255, 0.15);
            --grid-color: rgba(0, 209, 255, 0.05);
            --border-color: rgba(0, 209, 255, 0.1);
            --font-sans: 'Roobert', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            --ease-custom: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Immersive Background */
        .immersive-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #0c1a2e 0%, #05070a 60%);
        }

        .immersive-bg::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 1200px;
            height: 140%;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 209, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 209, 255, 0.03) 0%, transparent 60%);
            filter: blur(100px);
            opacity: 1;
            pointer-events: none;
        }

        /* Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            transition: all 0.3s var(--ease-custom);
            font-family: var(--font-sans);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px var(--beam-glow);
        }

        button {
            width: 100%;
            height: 48px;
            background: var(--accent-blue);
            color: var(--bg-base);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease-custom);
            font-family: var(--font-sans);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 209, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .security-note {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }

        .forgot-password a {
            font-size: 14px;
            color: var(--accent-blue);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .forgot-password a:hover {
            opacity: 0.8;
        }

        @media (max-width: 640px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="immersive-bg"></div>
    <div class="grid-overlay"></div>

    <div class="content">
        <div class="logo">SpotFunnel</div>

        <div class="card">
            <h1>Login</h1>
            <p class="description">Access your call history, bookings, and follow-ups.</p>

            <div id="errorMsg"
                style="margin-bottom: 20px; font-size: 14px; color: #ef4444; text-align: center; min-height: 20px;">
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit">Login</button>

                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>
            </form>

            <div class="security-note">
                Your data is encrypted and stored securely.
            </div>
        </div>
    </div>

    <!-- Supabase & Auth Service -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth-service.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = loginForm.querySelector('button[type="submit"]');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            // UI Loading state
            submitBtn.textContent = 'Logging in...';
            submitBtn.style.opacity = '0.7';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Call auth-service
            const { data, error } = await login(email, password);

            if (error) {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.textContent = 'Invalid credentials. Please try again.';
                submitBtn.textContent = 'Login';
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
            } else {
                // Success - Redirect
                // (Optional: You could check data.session here too)
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>

</html>
