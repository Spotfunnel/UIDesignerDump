<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SpotFunnel</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Roobert';
            src: url('fonts/RoobertTRIALVF-BF67243fd545701.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        :root {
            --bg-base: #05070a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-blue: #00D1FF;
            --beam-glow: rgba(0, 209, 255, 0.15);
            --grid-color: rgba(0, 209, 255, 0.05);
            --border-color: rgba(0, 209, 255, 0.1);
            --font-sans: 'Roobert', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            --ease-custom: cubic-bezier(0.16, 1, 0.3, 1);
            --status-good: #4CAF50;
            --status-critical: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Immersive Background */
        .immersive-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #0c1a2e 0%, #05070a 60%);
        }

        .immersive-bg::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 1200px;
            height: 140%;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 209, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 209, 255, 0.03) 0%, transparent 60%);
            filter: blur(100px);
            opacity: 1;
            pointer-events: none;
        }

        /* Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            transition: all 0.3s var(--ease-custom);
            font-family: var(--font-sans);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px var(--beam-glow);
        }

        button {
            width: 100%;
            height: 48px;
            background: var(--accent-blue);
            color: var(--bg-base);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease-custom);
            font-family: var(--font-sans);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 209, 255, 0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .back-link a {
            font-size: 14px;
            color: var(--accent-blue);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .back-link a:hover {
            opacity: 0.8;
        }

        #statusMsg {
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
        }

        .success-state {
            padding: 20px;
            text-align: center;
        }

        .success-state h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: var(--status-good);
        }

        .success-state p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        @media (max-width: 640px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="immersive-bg"></div>
    <div class="grid-overlay"></div>

    <div class="content">
        <div class="logo">SpotFunnel</div>

        <div class="card">
            <div id="formContainer">
                <h1>Reset Password</h1>
                <p class="description">Enter your email and we'll send you a link to reset your password.</p>

                <form id="resetForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>

                    <div id="statusMsg"></div>

                    <button type="submit">Send Reset Link</button>

                    <div class="back-link">
                        <a href="login.html">Back to Login</a>
                    </div>
                </form>
            </div>

            <div id="successContainer" style="display: none;">
                <div class="success-state">
                    <h2>✓ Check Your Email</h2>
                    <p>We've sent a password reset link to <strong id="sentEmail"></strong>. Click the link in the email
                        to set your new password.</p>
                    <p style="font-size: 13px; margin-top: 16px;">Didn't receive it? Check your spam folder.</p>
                    <div class="back-link" style="margin-top: 24px;">
                        <a href="login.html">Return to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase & Auth Service -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth-service.js"></script>

    <script>
        const resetForm = document.getElementById('resetForm');
        const submitBtn = resetForm.querySelector('button[type="submit"]');
        const statusMsg = document.getElementById('statusMsg');
        const formContainer = document.getElementById('formContainer');
        const successContainer = document.getElementById('successContainer');
        const sentEmail = document.getElementById('sentEmail');

        resetForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            statusMsg.textContent = '';

            const email = document.getElementById('email').value;

            // UI Loading
            submitBtn.textContent = 'Sending...';
            submitBtn.style.opacity = '0.7';
            submitBtn.disabled = true;

            try {
                // Call auth-service resetPassword function
                const { data, error } = await resetPassword(email);

                if (error) {
                    throw error;
                }

                // Success - Show confirmation
                console.log('Reset email sent to:', email);
                formContainer.style.display = 'none';
                successContainer.style.display = 'block';
                sentEmail.textContent = email;

            } catch (err) {
                console.error('Password reset failed:', err);
                statusMsg.style.color = 'var(--status-critical)';
                statusMsg.textContent = 'Error: ' + (err.message || 'Failed to send reset email');
                submitBtn.textContent = 'Send Reset Link';
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
